<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <body>
    <h1 class="display-1">Hello, world!</h1>

    <figure>
      <blockquote class="blockquote">
        <p>A well-known quote, contained in a blockquote element.</p>
      </blockquote>
      <figcaption class="blockquote-footer">
        Someone famous in <cite title="Source Title">Source Title</cite>
      </figcaption>
    </figure> 
    
    <p class="bg-dark text-light w-25 p-3 ">
      Lorem ipsum dolor sit, amet consectetur adipisicing elit. Iste, impedit.
    </p>

    <button>
      Spremi 
    </button>

    <button type="button" class="btn btn-primary ms-3">Spremi</button>    

    <div class="bg-info position-relative" style="height: 200px;">
      <div class="tiny-square bg-dark rounded-3 position-absolute"></div>
      <!--<div class="tiny-square bg-warning start-100 top-10<0 rounded-3 position-absolute"></div>-->
    </div>

    <div class="bg-light text-light d-flex flex-column justify-content-around align-items-center" style="height: 200px;">
      <div class="w-25 h-25 bg-warning">1</div>
      <div class="w-25 h-25 bg-info">2</div>
      <div class="w-25 h-25 bg-dark">3</div>

    </div>

    <button class="btn btn-primary position-relative">
      <i class="bi bi-envelope"></i> Pošta

    
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        99+
        <span class="visually-hidden">unread messages</span>
      </span>
    </button>

      <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">

    </div>
